# Kurulum paketleri: Windows (Inno Setup kurulumu + zip), Pardus / Debian
# (.deb), Arch / CachyOS (.pkg.tar.zst) ve Android (APK; imza:
# packaging/android/README.md). Elle (Actions → Paketler → Run workflow) ya da v* etiketiyle çalışır.
# Elle çalışınca çıktılar iş akışının "Artifacts" bölümünde; etiketle
# çalışınca ayrıca GitHub sürümü (Release) oluşur. Etikette "-" varsa
# (v0.1.0-beta.1) ön sürüm (pre-release) olarak işaretlenir.
#
# Sürüm numarası pubspec.yaml'dan gelir: "0.1.0+2" → Windows 0.1.0.2,
# .deb 0.1.0-2. Her betada derleme numarasını (+N) artırın; etiket
# pubspec'teki sürümle başlamalı (v0.1.0-beta.2 ↔ 0.1.0+2).
name: Paketler

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Hangi paket (etiketle tetiklenince hepsi)
        type: choice
        default: hepsi
        options: [hepsi, windows, pardus, android, arch]
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  windows:
    if: ${{ !inputs.platform || inputs.platform == 'hepsi' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Derle
        working-directory: apps/inken
        run: flutter build windows --release
      - name: VC++ çalışma zamanı DLL'leri
        # Temiz bir Windows'ta yoksa uygulama açılmaz; yeniden dağıtılabilir.
        shell: pwsh
        run: |
          $release = "apps/inken/build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "C:\Windows\System32\$dll" $release
          }
      - name: Kurulum dosyası
        shell: pwsh
        run: |
          $m = (Select-String -Path apps/inken/pubspec.yaml -Pattern '^version:\s*([0-9.]+)\+([0-9]+)').Matches[0]
          $version = "$($m.Groups[1].Value).$($m.Groups[2].Value)"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/windows/inken-pdf.iss
          Copy-Item LICENSE apps/inken/build/windows/x64/runner/Release/LICENSE.txt
          Compress-Archive -Path apps/inken/build/windows/x64/runner/Release/* -DestinationPath "dist/InkenPDF-tasinabilir-$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: inken-pdf-windows
          path: dist/*
      - name: MSIX (Microsoft Store ve deneme)
        # Store paketi imzasızdır; Store kendisi imzalar. Deneme paketi her
        # çalıştırmada üretilen, yayıncısı Store kimliğiyle aynı geçici
        # sertifikayla imzalanır; Windows'ta denemeden önce .cer kurulur
        # (packaging/windows/README.md). İkisi de GitHub sürümüne girmez.
        shell: pwsh
        working-directory: apps/inken
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $m = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+)\.([0-9]+)\.[0-9]+\+([0-9]+)').Matches[0]
          $msix = "$([int]$m.Groups[1].Value + 1).$($m.Groups[2].Value).$($m.Groups[3].Value).0"
          $out = "$env:GITHUB_WORKSPACE\msix"
          New-Item -ItemType Directory -Force $out | Out-Null
          dart run msix:create --version $msix --store --output-path $out --output-name "InkenPDF-Store-$msix"
          $publisher = (Select-String -Path pubspec.yaml -Pattern '^\s*publisher:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'Inken PDF deneme' -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pw = [guid]::NewGuid().ToString()
          $pfx = "$env:RUNNER_TEMP\deneme.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pw -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath "$out\InkenPDF-Deneme-sertifika.cer" | Out-Null
          dart run msix:create --version $msix --certificate-path $pfx --certificate-password $pw --output-path $out --output-name "InkenPDF-Deneme-$msix"
          Get-ChildItem $out
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: msix/*

  pardus:
    if: ${{ !inputs.platform || inputs.platform == 'hepsi' || inputs.platform == 'pardus' }}
    # Eski glibc'li sistemde derlenir: Pardus 23 (Debian 12) ve sonrasında çalışır.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: .deb
        run: packaging/linux/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: inken-pdf-pardus
          path: dist/*.deb

  android:
    if: ${{ !inputs.platform || inputs.platform == 'hepsi' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: İmza anahtarı (varsa)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/inken-release.jks"
            echo "INKEN_KEYSTORE=$RUNNER_TEMP/inken-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 yok: APK hata ayıklama anahtarıyla imzalanır (sürümler birbirinin üzerine kurulmaz)."
          fi
      - name: APK
        working-directory: apps/inken
        env:
          INKEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          INKEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          INKEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi
      - name: Adlandır
        run: |
          version="$(sed -n 's/^version: *\([0-9.]*\)+\([0-9]*\).*/\1+\2/p' apps/inken/pubspec.yaml)"
          out=apps/inken/build/app/outputs/flutter-apk
          mkdir -p dist
          cp "$out/app-arm64-v8a-release.apk" "dist/InkenPDF-$version-arm64.apk"
          cp "$out/app-armeabi-v7a-release.apk" "dist/InkenPDF-$version-armv7.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: inken-pdf-android
          path: dist/*.apk

  arch:
    if: ${{ !inputs.platform || inputs.platform == 'hepsi' || inputs.platform == 'arch' }}
    # Arch / CachyOS / Manjaro paketi (.pkg.tar.zst), Arch kapsayıcısında.
    # makepkg root olarak çalışmaz: Flutter derlemesi root, paketleme
    # ayrı kullanıcıyla (build_pkg.sh --no-build).
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Sistem paketleri
        run: |
          pacman -Syu --noconfirm --needed git curl unzip xz which jq \
            clang cmake ninja pkgconf gtk3
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Derle
        working-directory: apps/inken
        run: |
          git config --global --add safe.directory '*'
          flutter build linux --release
      - name: Paket
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "git config --global --add safe.directory '*' && packaging/arch/build_pkg.sh --no-build"
      - uses: actions/upload-artifact@v4
        with:
          name: inken-pdf-arch
          path: dist/*.pkg.tar.zst

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, pardus, android, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Etiket pubspec'le uyuşuyor mu
        run: |
          version="$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' apps/inken/pubspec.yaml)"
          case "${GITHUB_REF_NAME#v}" in
            "$version"|"$version"-*) ;;
            *) echo "Etiket $GITHUB_REF_NAME, pubspec $version" >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: inken-pdf-*
          merge-multiple: true
      - name: Sürüm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          args=(--title "Inken PDF ${tag#v}" --target "$GITHUB_SHA")
          [[ "$tag" == *-* ]] && args+=(--prerelease)
          notes="packaging/release-notes/$tag.md"
          if [[ -f "$notes" ]]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "$tag" out/* "${args[@]}"
